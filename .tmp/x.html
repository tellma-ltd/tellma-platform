<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Render</title>
</head>
<body>

<svg width="100%" viewBox="0 0 680 410" role="img">
    <title>How the store check finds pending migrations</title>
    <desc>The web host's copy of Tellma.Identity.Migrations lists three migrations; the catalog's
        history table records two; the difference is one pending migration, so the host stops and
        names the migrate command.</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
        </marker>
    </defs>
    <g class="c-purple">
        <rect x="40" y="20" width="280" height="260" rx="20" stroke-width="0.5" />
        <text class="th" x="180" y="46" text-anchor="middle" dominant-baseline="central">Web host
            process (code)</text>
        <text class="ts" x="180" y="66" text-anchor="middle" dominant-baseline="central">What the
            release shipped</text>
    </g>
    <rect class="box" x="60" y="84" width="240" height="180" rx="8" stroke-width="0.5" />
    <text class="th" x="180" y="106" text-anchor="middle" dominant-baseline="central">
        Tellma.Identity.Migrations</text>
    <rect class="box" x="80" y="126" width="200" height="30" rx="4" stroke-width="0.5" />
    <text class="t" x="180" y="141" text-anchor="middle" dominant-baseline="central">Initial</text>
    <rect class="box" x="80" y="166" width="200" height="30" rx="4" stroke-width="0.5" />
    <text class="t" x="180" y="181" text-anchor="middle" dominant-baseline="central">Migration 2</text>
    <rect class="box" x="80" y="206" width="200" height="30" rx="4" stroke-width="0.5" />
    <text class="t" x="180" y="221" text-anchor="middle" dominant-baseline="central">Migration 3</text>
    <g class="c-teal">
        <rect x="360" y="20" width="280" height="260" rx="20" stroke-width="0.5" />
        <text class="th" x="500" y="46" text-anchor="middle" dominant-baseline="central">Catalog
            database (data)</text>
        <text class="ts" x="500" y="66" text-anchor="middle" dominant-baseline="central">What was
            actually applied</text>
    </g>
    <rect class="box" x="380" y="84" width="240" height="180" rx="8" stroke-width="0.5" />
    <text class="th" x="500" y="106" text-anchor="middle" dominant-baseline="central">
        dbo.__EFMigrationsHistory</text>
    <rect class="box" x="400" y="126" width="200" height="30" rx="4" stroke-width="0.5" />
    <text class="t" x="500" y="141" text-anchor="middle" dominant-baseline="central">Initial</text>
    <rect class="box" x="400" y="166" width="200" height="30" rx="4" stroke-width="0.5" />
    <text class="t" x="500" y="181" text-anchor="middle" dominant-baseline="central">Migration 2</text>
    <rect x="400" y="206" width="200" height="30" rx="4" fill="none" stroke="var(--t)"
        stroke-width="0.5" stroke-dasharray="4 3" />
    <text class="ts" x="500" y="221" text-anchor="middle" dominant-baseline="central">no row: not
        applied</text>
    <line x1="180" y1="282" x2="268" y2="318" class="arr" marker-end="url(#arrow)" />
    <line x1="500" y1="282" x2="412" y2="318" class="arr" marker-end="url(#arrow)" />
    <g class="c-coral">
        <rect x="170" y="322" width="340" height="60" rx="8" stroke-width="0.5" />
        <text class="th" x="340" y="342" text-anchor="middle" dominant-baseline="central">Store
            check: 3 known minus 2 applied</text>
        <text class="ts" x="340" y="364" text-anchor="middle" dominant-baseline="central">1 pending:
            host stops, names migrate</text>
    </g>
</svg>

</body>
</html>
