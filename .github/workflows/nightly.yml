name: Nightly live connector suites

# The live SendGrid, ACS and Marmin UAE suites talk to real third-party APIs, so they are never a
# PR gate: an
# external service on the merge path is a permanent flakiness tax, and fork PRs cannot read the
# secrets anyway — they would only ever skip. A daily pulse plus the offline vectors detects API or
# credential drift within a day.
on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  sendgrid-live:
    # Forks inherit the schedule; this makes it a no-op there.
    if: github.repository == 'tellma-ltd/tellma-platform'
    runs-on: ubuntu-latest
    # The environment scopes the secrets. Deliberately no required reviewers: a protected
    # environment would leave every scheduled run waiting for an approval nobody is awake to give.
    environment: live-email-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # The suites gate themselves on these variables being present, so a missing or expired secret
      # would otherwise skip every test and report a green run — the exact silence this workflow
      # exists to break.
      - name: Require the SendGrid credentials
        env:
          TELLMA_SENDGRID_TEST_APIKEY: ${{ secrets.SENDGRID_TEST_APIKEY }}
          TELLMA_SENDGRID_TEST_SENDER: ${{ vars.SENDGRID_TEST_SENDER }}
        run: |
          set -euo pipefail
          : "${TELLMA_SENDGRID_TEST_APIKEY:?SENDGRID_TEST_APIKEY is not set on the live-email-tests environment}"
          : "${TELLMA_SENDGRID_TEST_SENDER:?SENDGRID_TEST_SENDER is not set on the live-email-tests environment}"
      - name: SendGrid live suite (sandbox mode — validated, never delivered, no credits)
        env:
          TELLMA_SENDGRID_TEST_APIKEY: ${{ secrets.SENDGRID_TEST_APIKEY }}
          TELLMA_SENDGRID_TEST_SENDER: ${{ vars.SENDGRID_TEST_SENDER }}
        # Solution-wide and filtered by trait, not by project path: a live suite added later is
        # picked up here without anyone remembering to edit this file.
        run: >
          dotnet test Tellma.slnx -c Release
          --filter "Live=true&FullyQualifiedName~SendGrid"

  acs-live:
    if: github.repository == 'tellma-ltd/tellma-platform'
    runs-on: ubuntu-latest
    environment: live-email-tests
    permissions:
      # Mint the GitHub OIDC token the federated Entra credential trades for an Azure token; there
      # is no ACS secret to store, which is the point of the managed-identity design.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.ACS_TEST_CLIENT_ID }}
          tenant-id: ${{ vars.ACS_TEST_TENANT_ID }}
          subscription-id: ${{ vars.ACS_TEST_SUBSCRIPTION_ID }}
      - name: Require the ACS configuration
        env:
          TELLMA_ACS_TEST_ENDPOINT: ${{ vars.ACS_TEST_ENDPOINT }}
          TELLMA_ACS_TEST_SENDER: ${{ vars.ACS_TEST_SENDER }}
          TELLMA_ACS_TEST_RECIPIENT: ${{ secrets.ACS_TEST_RECIPIENT }}
        run: |
          set -euo pipefail
          : "${TELLMA_ACS_TEST_ENDPOINT:?ACS_TEST_ENDPOINT is not set on the live-email-tests environment}"
          : "${TELLMA_ACS_TEST_SENDER:?ACS_TEST_SENDER is not set on the live-email-tests environment}"
          : "${TELLMA_ACS_TEST_RECIPIENT:?ACS_TEST_RECIPIENT is not set on the live-email-tests environment}"
      - name: ACS live suite (real delivery to the Tellma-owned test mailbox)
        env:
          TELLMA_ACS_TEST_ENDPOINT: ${{ vars.ACS_TEST_ENDPOINT }}
          TELLMA_ACS_TEST_SENDER: ${{ vars.ACS_TEST_SENDER }}
          # A secret only so a live mailbox address is not published in a public repository.
          TELLMA_ACS_TEST_RECIPIENT: ${{ secrets.ACS_TEST_RECIPIENT }}
        run: >
          dotnet test Tellma.slnx -c Release
          --filter "Live=true&FullyQualifiedName~AcsEmail"

  marminae-live:
    if: github.repository == 'tellma-ltd/tellma-platform'
    runs-on: ubuntu-latest
    # A separate environment from the email suites: an e-invoicing credential has no business being
    # readable by a job that only needs to send mail.
    environment: live-einvoicing-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # The suite gates itself on these variables being present, so a missing or expired secret
      # would otherwise skip every test and report a green run.
      - name: Require the Marmin UAE sandbox credentials
        env:
          TELLMA_MARMINAE_TEST_CLIENTID: ${{ vars.MARMINAE_TEST_CLIENTID }}
          TELLMA_MARMINAE_TEST_CLIENTSECRET: ${{ secrets.MARMINAE_TEST_CLIENTSECRET }}
          TELLMA_MARMINAE_TEST_PROFILEID: ${{ secrets.MARMINAE_TEST_PROFILEID }}
        run: |
          set -euo pipefail
          : "${TELLMA_MARMINAE_TEST_CLIENTID:?MARMINAE_TEST_CLIENTID is not set on the live-einvoicing-tests environment}"
          : "${TELLMA_MARMINAE_TEST_CLIENTSECRET:?MARMINAE_TEST_CLIENTSECRET is not set on the live-einvoicing-tests environment}"
          : "${TELLMA_MARMINAE_TEST_PROFILEID:?MARMINAE_TEST_PROFILEID is not set on the live-einvoicing-tests environment}"
      - name: Marmin UAE live suite (sandbox — no counterparty, no authority, no delete)
        env:
          TELLMA_MARMINAE_TEST_CLIENTID: ${{ vars.MARMINAE_TEST_CLIENTID }}
          TELLMA_MARMINAE_TEST_CLIENTSECRET: ${{ secrets.MARMINAE_TEST_CLIENTSECRET }}
          TELLMA_MARMINAE_TEST_PROFILEID: ${{ secrets.MARMINAE_TEST_PROFILEID }}
          # Unset means the sandbox host the suite defaults to.
          TELLMA_MARMINAE_TEST_BASEADDRESS: ${{ vars.MARMINAE_TEST_BASEADDRESS }}
        # Solution-wide and filtered by trait, for the same reason the suites above are. The
        # logger takes no file name: every project in the solution writes into this one directory,
        # and a fixed name would have them overwrite each other's results.
        run: >
          dotnet test Tellma.slnx -c Release
          --filter "Live=true&FullyQualifiedName~MarminAe"
          --logger trx
          --results-directory artifacts/marminae-live
      # Every response body the run saw, named for the offline vector it would become. This artifact
      # is how a hand-authored vector gets replaced by a capture, and how a failure is read at all.
      - name: Upload the live transcript and response bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marminae-live-transcript
          path: artifacts/marminae-live
          if-no-files-found: warn

  # A nightly that fails silently is a nightly that does not exist.
  report-failure:
    if: ${{ always() && github.repository == 'tellma-ltd/tellma-platform' && contains(needs.*.result, 'failure') }}
    needs: [sendgrid-live, acs-live, marminae-live]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open or comment on the standing failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The label is the dedupe key, so it has to exist before either branch below: gh refuses a
          # --label it cannot resolve, and a missing one would file a fresh unlabelled issue every
          # night while the search that is supposed to find yesterday's keeps coming back empty.
          # --force makes this idempotent, so a fresh clone of the repository needs no manual setup.
          gh label create live-test-failure --repo "$GITHUB_REPOSITORY" --force \
            --color d73a4a --description "The nightly live connector suites are failing"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label live-test-failure --state open \
                --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Nightly live suites failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label live-test-failure \
              --title "Nightly live connector suites are failing" \
              --body "First failure: $RUN_URL"
          fi
