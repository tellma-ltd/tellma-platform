# Nightly tier: the slow, broad and timing-sensitive tests the PR tier (ci.yml) leaves out.
#
# GitHub fires `schedule` (and accepts `workflow_dispatch`) only for workflows on the default
# branch, so main carries a trampoline under this same file name: each night it runs
# `gh workflow run nightly-tier.yml --ref platform-core`, and GitHub then runs THIS version of the
# file from platform-core. Hence no schedule here, and every job is guarded to platform-core: a
# dispatch on any other branch that carries this file skips every job.
#
# When platform-core merges into main, this file replaces the trampoline. At that merge, add the
# schedule trigger back and point the job guards at refs/heads/main, or the nightly tier stops
# running.
#
# Selection, mirrored by CONTRIBUTING.md:
#   - dotnet: every test carrying [Trait("Category", "Nightly")], whatever its other Category
#     (Integration and E2E tests included), except Live=true suites, which need credentials and
#     run in nightly.yml. On Linux all of them; on Windows those that are neither Integration nor
#     E2E, matching the OS coverage the PR tier gives each kind.
#   - Playwright: every test tagged @nightly, @cross-engine or @perf, on all four projects, minus
#     the quarantined ones. The Firefox and WebKit projects keep their own @cross-engine filter on
#     top, so a @nightly or @perf test reaches them only when it is also tagged @cross-engine.
#   - Quarantined Playwright tests (@quarantine) run in a job of their own, ten times each, and
#     report per test whether they passed, flaked or failed. That job never decides the run's
#     verdict: a known flake must not hide a new failure in the jobs above.
# An empty tier is a green run: every test step deliberately passes when nothing matches.
name: Nightly tier

on:
  workflow_dispatch: {}

permissions:
  contents: read

# One nightly at a time, never cancelled: a manual dispatch while the scheduled run is still going
# queues behind it rather than replacing it.
concurrency:
  group: nightly-tier
  cancel-in-progress: false

jobs:
  # The dotnet nightly tier on Linux, every kind of test: integration tests bring up Linux SQL
  # Server containers, which Windows runners cannot host. The Chromium install serves the identity
  # E2E project, whose Playwright tests may carry the Nightly category too.
  dotnet:
    if: github.ref == 'refs/heads/platform-core'
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Tellma.slnx
      - run: dotnet build Tellma.slnx -c Release --no-restore
      - name: Install Chromium
        timeout-minutes: 10
        run: pwsh test/apps/Tellma.Identity.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      # A filter that matches no test is not an error for `dotnet test`: each assembly reports
      # "No test matches the given testcase filter" and the step still exits 0.
      - name: Nightly-tier dotnet tests
        run: dotnet test Tellma.slnx -c Release --no-build --filter "Category=Nightly&Live!=true"
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-traces
          path: test/apps/Tellma.Identity.E2E/bin/Release/net10.0/playwright-traces
          if-no-files-found: ignore

  # The Windows half of the dotnet nightly tier. The PR tier runs the unit suites on both OSes, so a
  # unit test moved to the nightly tier must keep its Windows run. Integration and E2E tests stay on
  # the Linux job above: they need Linux containers or the Linux browser setup.
  dotnet-windows:
    if: github.ref == 'refs/heads/platform-core'
    timeout-minutes: 120
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Tellma.slnx
      - run: dotnet build Tellma.slnx -c Release --no-restore
      - name: Nightly-tier dotnet unit tests
        run: dotnet test Tellma.slnx -c Release --no-build --filter "Category=Nightly&Category!=Integration&Category!=E2E&Live!=true"

  # The Playwright nightly tier on the showcase, every browser engine, quarantined tests excluded.
  client-e2e:
    if: github.ref == 'refs/heads/platform-core'
    timeout-minutes: 120
    runs-on: ubuntu-latest
    # The client's own scripts run from client/, where their path arguments (the report and
    # output folders below) resolve; the install step alone runs at the workspace root.
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from the root package.json packageManager
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # The one pnpm workspace is rooted at the repository root.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Install browsers
        timeout-minutes: 15
        run: pnpm exec playwright install chromium firefox webkit --with-deps
      # The tokens CSS is generated, not committed, and the showcase build needs it.
      - run: pnpm run tokens:build-css
      # Built up front, as in the PR tier, so the e2e web server reuses the bundle instead of
      # folding a cold production build into its startup timeout.
      - run: pnpm run build:showcase
      # No --project: on CI the script runs all four projects in one invocation. Without
      # --pass-with-no-tests Playwright fails a run that selects nothing.
      - name: Nightly-tier e2e (all engines)
        run: node scripts/e2e.mjs --grep "@nightly|@cross-engine|@perf" --grep-invert "@quarantine" --pass-with-no-tests
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-client-e2e-report
          path: client/.artifacts/e2e
          if-no-files-found: ignore

  # The quarantined Playwright tests: flaky tests taken out of the PR tier until they are fixed. Each
  # runs ten times so the job measures a flake rate rather than tossing a coin once, and tells a test
  # that still flakes from one that now fails every run. failOnFlakyTests stays on, so the job's own
  # conclusion is honest, but `continue-on-error` keeps it out of the run's verdict. Triage reads the
  # per-test table in the job summary; the full report is uploaded whatever the outcome.
  client-e2e-quarantine:
    if: github.ref == 'refs/heads/platform-core'
    continue-on-error: true
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # The client's own scripts run from client/, where their path arguments (the report and
    # output folders below) resolve; the install step alone runs at the workspace root.
    defaults:
      run:
        working-directory: client
    env:
      # The CLI --reporter below replaces the config's reporters, so their output locations are set
      # here: the JSON report feeds the summary step, the HTML report is uploaded.
      PLAYWRIGHT_JSON_OUTPUT_FILE: .artifacts/e2e-quarantine/report.json
      PLAYWRIGHT_HTML_OUTPUT_DIR: .artifacts/e2e-quarantine/report
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from the root package.json packageManager
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # The one pnpm workspace is rooted at the repository root.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Install browsers
        timeout-minutes: 15
        run: pnpm exec playwright install chromium firefox webkit --with-deps
      - run: pnpm run tokens:build-css
      - run: pnpm run build:showcase
      # All projects, so a quarantined @cross-engine test still runs on every engine.
      - name: Quarantined e2e (ten runs each)
        run: >
          node scripts/e2e.mjs --grep "@quarantine" --repeat-each 10 --pass-with-no-tests
          --reporter list,json,html
          --output .artifacts/e2e-quarantine/results
      - name: Summarise the quarantined tests
        if: always()
        run: node scripts/e2e-quarantine-summary.mjs .artifacts/e2e-quarantine/report.json
      - name: Upload the quarantined-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-quarantine-e2e-report
          path: client/.artifacts/e2e-quarantine
          if-no-files-found: ignore
