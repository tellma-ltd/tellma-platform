# Nightly tier: the slow, broad and timing-sensitive tests the PR tier (ci.yml) leaves out, and the
# Windows run of three integration suites the PR tier runs on Linux only.
#
# GitHub fires `schedule` (and accepts `workflow_dispatch`) only for workflows on the default
# branch, so main carries a trampoline under this same file name: each night it runs
# `gh workflow run nightly-tier.yml --ref platform-core`, and GitHub then runs THIS version of the
# file from platform-core. Hence no schedule here, and every job is guarded to platform-core.
#
# The guards also let a manual dispatch of a `pc/**` working branch through
# (`gh workflow run nightly-tier.yml --ref pc/<id>`), so a fix to a failure only this tier sees is
# proven on its own branch before it merges onward. A working branch runs this tier only on such a
# dispatch, never on a schedule or a push. A dispatch on any other branch that carries this file
# skips every job.
#
# When platform-core merges into main, this file replaces the trampoline. At that merge, add the
# schedule trigger back and point the job guards' platform-core half at refs/heads/main, or the
# nightly tier stops running.
#
# Selection, mirrored by CONTRIBUTING.md:
#   - dotnet: every test carrying [Trait("Category", "Nightly")], whatever its other Category
#     (Integration and E2E tests included), except Live=true suites, which need credentials and
#     run in nightly.yml. On Linux all of them; on Windows those that are neither Integration nor
#     E2E, matching the OS coverage the PR tier gives each kind.
#   - dotnet integration on Windows: the PR tier runs no integration tests on Windows, so this
#     tier runs the platform's (Tellma.Core.IntegrationTests), the web surface's
#     (Tellma.Core.AspNetCore.IntegrationTests) and the reference distribution's
#     (Tellma.Distro.Acme.IntegrationTests) integration suites there, against LocalDB, with the PR
#     tier's own filter: their tests that are not Nightly and not Live=true. The other integration
#     suites, and every Nightly integration test, run on Linux only.
#   - Playwright: every test tagged @nightly, @cross-engine or @perf, on all four projects, minus
#     the quarantined ones. The Firefox and WebKit projects keep their own @cross-engine filter on
#     top, so a @nightly or @perf test reaches them only when it is also tagged @cross-engine.
#   - The Acme browser suite: its @nightly and @perf gates on Linux, and every flow on Windows
#     against LocalDB, quarantined tests excluded; the PR tier runs the other flows on Linux.
#   - Quarantined Playwright tests (@quarantine) run in a job of their own, ten times each, and
#     report per test whether they passed, flaked or failed. That job never decides the run's
#     verdict: a known flake must not hide a new failure in the jobs above.
# An empty tier is a green run: every test step deliberately passes when nothing matches.
name: Nightly tier

on:
  workflow_dispatch: {}

permissions:
  contents: read

# One nightly at a time per branch, never cancelled: a manual dispatch while the scheduled run is
# still going queues behind it rather than replacing it. The group is per branch because GitHub
# keeps one pending run per group and cancels an older pending one, so a working branch's dispatch
# must never share platform-core's group, where it could cancel a queued nightly.
concurrency:
  group: nightly-tier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The dotnet nightly tier on Linux, every kind of test: integration tests bring up Linux SQL
  # Server containers, which Windows runners cannot host. The Chromium install serves the identity
  # E2E project, whose Playwright tests may carry the Nightly category too.
  dotnet:
    if: github.ref == 'refs/heads/platform-core' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/pc/'))
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Tellma.slnx
      - run: dotnet build Tellma.slnx -c Release --no-restore
      # Not `install --with-deps`: the script installs the OS packages with bounded retries and, when
      # the apt mirrors are down, lets the job go on with a warning as long as Chromium launches.
      - name: Install Chromium
        timeout-minutes: 10
        run: bash eng/playwright-browsers/install-browsers.sh chromium -- pwsh test/apps/Tellma.Identity.E2E/bin/Release/net10.0/playwright.ps1
      # A filter that matches no test is not an error for `dotnet test`: each assembly reports
      # "No test matches the given testcase filter" and the step still exits 0.
      - name: Nightly-tier dotnet tests
        run: dotnet test Tellma.slnx -c Release --no-build --filter "Category=Nightly&Live!=true"
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-traces
          path: test/apps/Tellma.Identity.E2E/bin/Release/net10.0/playwright-traces
          if-no-files-found: ignore

  # The Windows half of the dotnet nightly tier. The PR tier runs the unit suites on both OSes, so a
  # unit test moved to the nightly tier must keep its Windows run. Nightly integration and E2E tests
  # stay on the Linux job above: they need Linux containers or the Linux browser setup.
  dotnet-windows:
    if: github.ref == 'refs/heads/platform-core' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/pc/'))
    timeout-minutes: 120
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Tellma.slnx
      - run: dotnet build Tellma.slnx -c Release --no-restore
      - name: Nightly-tier dotnet unit tests
        run: dotnet test Tellma.slnx -c Release --no-build --filter "Category=Nightly&Category!=Integration&Category!=E2E&Live!=true"

  # The distribution host's three integration suites on Windows, against LocalDB rather than a
  # container (the Windows runners have no Linux containers): the platform's catalog and migrator
  # suite, the web surface's end to end over the reference distribution, and the reference
  # distribution's. LocalDB is installed when the image lacks it. These are the PR tier's tests of
  # those three suites (Nightly excluded, as in ci.yml's integration job), which
  # the PR tier runs on Linux only. The other integration suites need nothing Windows-specific and
  # run on Linux alone, in the PR tier and in the dotnet job above.
  integration-windows:
    if: github.ref == 'refs/heads/platform-core' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/pc/'))
    timeout-minutes: 45
    runs-on: windows-latest
    env:
      TELLMA_TEST_SQL: 'Server=(localdb)\MSSQLLocalDB;Integrated Security=True;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Start LocalDB
        shell: pwsh
        run: |
          # The installer's PATH change does not reach this shell, and its folder names the SQL
          # Server version, so the tool is located rather than assumed and its folder is added for
          # this step and the later ones.
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) {
            choco install sqllocaldb --no-progress -y
            $tool = Get-ChildItem "$env:ProgramFiles\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe" | Select-Object -First 1
            if (-not $tool) { throw 'SqlLocalDB.exe was not found after its install.' }
            $env:PATH += ";$($tool.DirectoryName)"
            Add-Content -Path $env:GITHUB_PATH -Value $tool.DirectoryName
          }
          if (-not (sqllocaldb info | Where-Object { $_.Trim() -eq 'MSSQLLocalDB' })) {
            sqllocaldb create MSSQLLocalDB
          }
          sqllocaldb start MSSQLLocalDB
      - run: dotnet build test/core/Tellma.Core.IntegrationTests -c Release
      - run: dotnet build distributions/acme/test/Tellma.Distro.Acme.IntegrationTests -c Release
      - run: dotnet build test/core/Tellma.Core.AspNetCore.IntegrationTests -c Release
      # The instance's first logins can fail while it warms up, and a suite's first catalog load
      # would then classify that error instead of the one under test. A query against master,
      # retried until it answers, leaves the instance warm. The instance's pipe name serves either
      # sqlcmd (the ODBC one or the Go one).
      - name: Warm LocalDB
        shell: pwsh
        run: |
          if (-not (Get-Command sqlcmd -ErrorAction SilentlyContinue)) {
            choco install sqlcmd --no-progress -y
          }
          sqllocaldb start MSSQLLocalDB
          $pipe = (sqllocaldb info MSSQLLocalDB | Select-String 'np:\S+').Matches[0].Value
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            sqlcmd -S $pipe -E -d master -l 30 -b -Q 'SELECT 1'
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 5
          }
          throw 'LocalDB did not answer a query against master.'
      # Normal verbosity and xUnit's diagnostic messages, as in ci.yml's build-test job. Here they
      # show what the end-of-suite drops on LocalDB retried, and every database a failed cleanup
      # left behind.
      - run: dotnet test test/core/Tellma.Core.IntegrationTests -c Release --no-build --filter "Category=Integration&Category!=Nightly&Live!=true" --logger "console;verbosity=normal" -- xUnit.DiagnosticMessages=true
      - run: dotnet test distributions/acme/test/Tellma.Distro.Acme.IntegrationTests -c Release --no-build --filter "Category=Integration&Category!=Nightly&Live!=true" --logger "console;verbosity=normal" -- xUnit.DiagnosticMessages=true
      - run: dotnet test test/core/Tellma.Core.AspNetCore.IntegrationTests -c Release --no-build --filter "Category=Integration&Category!=Nightly&Live!=true" --logger "console;verbosity=normal" -- xUnit.DiagnosticMessages=true

  # The Acme browser suite's nightly gates on Linux (spec 0024 §12): installability, the cold
  # launch on Slow 4G and the warm chrome under CPU throttling, all through Chromium's DevTools
  # protocol, on the e2e host over a SQL Server container and the published app.
  acme-e2e:
    if: github.ref == 'refs/heads/platform-core' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/pc/'))
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6 # version from the root package.json packageManager
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # As in client-e2e: survives an apt-mirror outage as long as Chromium still launches.
      - name: Install Chromium
        timeout-minutes: 15
        run: bash eng/playwright-browsers/install-browsers.sh chromium -- distributions/acme/test/Tellma.Distro.Acme.E2E/node_modules/.bin/playwright
      # The publish builds the client app once; the e2e host serves its wwwroot.
      - run: dotnet publish distributions/acme/src/Tellma.Distro.Acme.Web -c Release -o "${{ runner.temp }}/acme-web"
      - name: Acme nightly gates
        env:
          TELLMA_E2E_WEBROOT: ${{ runner.temp }}/acme-web/wwwroot
          TELLMA_E2E_CONFIGURATION: Release
        run: node distributions/acme/test/Tellma.Distro.Acme.E2E/scripts/e2e.mjs --grep "@nightly|@perf" --grep-invert "@quarantine" --pass-with-no-tests
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-acme-e2e-report
          path: distributions/acme/test/Tellma.Distro.Acme.E2E/.artifacts
          if-no-files-found: ignore
          # The report's folder is hidden, which the action skips unless told otherwise.
          include-hidden-files: true

  # The Acme browser suite on Windows (spec 0024 §14: the e2e host runs on Ubuntu and Windows):
  # every flow, nightly gates included, against LocalDB. The PR tier runs it on Linux alone.
  acme-e2e-windows:
    if: github.ref == 'refs/heads/platform-core' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/pc/'))
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6 # version from the root package.json packageManager
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # As in integration-windows: the tool is located rather than assumed, and the instance created
      # when the runner image lacks it.
      - name: Start LocalDB
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) {
            choco install sqllocaldb --no-progress -y
            $tool = Get-ChildItem "$env:ProgramFiles\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe" | Select-Object -First 1
            if (-not $tool) { throw 'SqlLocalDB.exe was not found after its install.' }
            $env:PATH += ";$($tool.DirectoryName)"
            Add-Content -Path $env:GITHUB_PATH -Value $tool.DirectoryName
          }
          if (-not (sqllocaldb info | Where-Object { $_.Trim() -eq 'MSSQLLocalDB' })) {
            sqllocaldb create MSSQLLocalDB
          }
          sqllocaldb start MSSQLLocalDB
      - name: Install Chromium
        timeout-minutes: 15
        run: pnpm --dir distributions/acme/test/Tellma.Distro.Acme.E2E exec playwright install chromium
      - run: dotnet publish distributions/acme/src/Tellma.Distro.Acme.Web -c Release -o "${{ runner.temp }}/acme-web"
      # The web host's sign-in fetches the identity engine's discovery document from its own
      # https://localhost origin, so .NET must trust the ASP.NET development certificate that
      # Kestrel serves, or the sign-in fails with an untrusted root. The e2e host trusts it itself
      # on Linux, but on Windows `dotnet dev-certs https --trust` adds it to CurrentUser\Root, which
      # Windows confirms in a dialog nobody on a runner can answer, so the host only creates it
      # there. This step creates it and adds its public certificate to LocalMachine\Root instead:
      # the runner's account is an administrator, a machine store takes a certificate without a
      # prompt, and every account's chain engine, .NET's included, trusts that store's roots. The
      # private key stays in the user's store, and the trust goes with the runner at the job's end.
      - name: Trust the development certificate
        shell: pwsh
        run: |
          dotnet dev-certs https
          if ($LASTEXITCODE -ne 0) { throw "dotnet dev-certs https failed (exit $LASTEXITCODE)." }

          # The valid development certificates, as dotnet dev-certs makes them and Kestrel serves
          # them: ASP.NET Core's marker extension, self-signed for localhost, with the private key
          # beside them, and within their validity dates. Nothing else becomes a machine root.
          $marker = '1.3.6.1.4.1.311.84.1.1'
          $now = Get-Date
          $certificates = @(Get-ChildItem Cert:\CurrentUser\My | Where-Object {
            ($_.Extensions | Where-Object { $_.Oid.Value -eq $marker }) -and
            $_.Subject -eq 'CN=localhost' -and $_.Issuer -eq $_.Subject -and $_.HasPrivateKey -and
            $_.NotBefore -le $now -and $now -lt $_.NotAfter
          })
          if ($certificates.Count -eq 0) {
            throw 'dotnet dev-certs https left no valid self-signed localhost development certificate in CurrentUser\My.'
          }

          # The check the web host's own call makes: the chain builds to a trusted root. The
          # certificate names no revocation list, so revocation is not checked.
          function Test-Trusted([System.Security.Cryptography.X509Certificates.X509Certificate2] $certificate) {
            $chain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
            $chain.ChainPolicy.RevocationMode = 'NoCheck'
            try {
              return [pscustomobject]@{
                Trusted = $chain.Build($certificate)
                Status = ($chain.ChainStatus | ForEach-Object { $_.Status }) -join ', '
              }
            } finally {
              $chain.Dispose()
            }
          }

          # --- Each certificate not yet trusted goes to LocalMachine\Root, public part only ---
          # One line per certificate says which path it took, so the log shows whether the add ran.
          $untrusted = @()
          foreach ($certificate in $certificates) {
            if ((Test-Trusted $certificate).Trusted) {
              Write-Output "$($certificate.Thumbprint) already trusted."
            } else {
              Write-Output "Adding $($certificate.Thumbprint) to LocalMachine\Root."
              $untrusted += $certificate
            }
          }
          if ($untrusted.Count -gt 0) {
            $root = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
            $root.Open('ReadWrite')
            try {
              foreach ($certificate in $untrusted) {
                $root.Add([System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certificate.RawData))
              }
            } finally {
              $root.Close()
            }
          }

          # --- Every certificate is now trusted, or the step fails before the suite starts ---
          foreach ($certificate in $certificates) {
            $result = Test-Trusted $certificate
            if (-not $result.Trusted) {
              throw "The development certificate $($certificate.Thumbprint) is still untrusted ($($result.Status))."
            }
            Write-Output "The development certificate $($certificate.Thumbprint) is trusted."
          }
      - name: Acme browser suite (Windows)
        env:
          TELLMA_E2E_SQL: localdb
          TELLMA_E2E_WEBROOT: ${{ runner.temp }}/acme-web/wwwroot
          TELLMA_E2E_CONFIGURATION: Release
        run: node distributions/acme/test/Tellma.Distro.Acme.E2E/scripts/e2e.mjs --grep-invert "@quarantine"
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-acme-e2e-windows-report
          path: distributions/acme/test/Tellma.Distro.Acme.E2E/.artifacts
          if-no-files-found: ignore
          # The report's folder is hidden, which the action skips unless told otherwise.
          include-hidden-files: true

  # The Playwright nightly tier on the showcase, every browser engine, quarantined tests excluded.
  client-e2e:
    if: github.ref == 'refs/heads/platform-core' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/pc/'))
    timeout-minutes: 120
    runs-on: ubuntu-latest
    # The client's own scripts run from client/, where their path arguments (the report and
    # output folders below) resolve; the install step alone runs at the workspace root.
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from the root package.json packageManager
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # The one pnpm workspace is rooted at the repository root.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # The script survives an apt-mirror outage as long as every engine still launches (see the
      # dotnet job). Its path starts at the repository root, one level above this job's working
      # directory. The CLI is the package's bin shim and not `pnpm exec`, because the script runs it
      # as root to install the OS packages (eng/playwright-browsers/README.md).
      - name: Install browsers
        timeout-minutes: 15
        run: bash ../eng/playwright-browsers/install-browsers.sh chromium firefox webkit -- node_modules/.bin/playwright
      # The tokens CSS is generated, not committed, and the showcase build needs it.
      - run: pnpm run tokens:build-css
      # Built in a step of its own, as in the PR tier, so a build failure shows as a failed build
      # step; the e2e script then finds the bundle current and serves it without rebuilding.
      - run: pnpm run build:showcase
      # No --project: on CI the script runs all four projects in one invocation. Without
      # --pass-with-no-tests Playwright fails a run that selects nothing.
      - name: Nightly-tier e2e (all engines)
        run: node scripts/e2e.mjs --grep "@nightly|@cross-engine|@perf" --grep-invert "@quarantine" --pass-with-no-tests
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-client-e2e-report
          path: client/.artifacts/e2e
          if-no-files-found: ignore

  # The quarantined Playwright tests: flaky tests taken out of the PR tier until they are fixed. Each
  # runs ten times so the job measures a flake rate rather than tossing a coin once, and tells a test
  # that still flakes from one that now fails every run. failOnFlakyTests stays on, so the job's own
  # conclusion is honest, but `continue-on-error` keeps it out of the run's verdict. Triage reads the
  # per-test table in the job summary; the full report is uploaded whatever the outcome.
  client-e2e-quarantine:
    if: github.ref == 'refs/heads/platform-core' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/pc/'))
    continue-on-error: true
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # The client's own scripts run from client/, where their path arguments (the report and
    # output folders below) resolve; the install step alone runs at the workspace root.
    defaults:
      run:
        working-directory: client
    env:
      # The CLI --reporter below replaces the config's reporters, so their output locations are set
      # here: the JSON report feeds the summary step, the HTML report is uploaded.
      PLAYWRIGHT_JSON_OUTPUT_FILE: .artifacts/e2e-quarantine/report.json
      PLAYWRIGHT_HTML_OUTPUT_DIR: .artifacts/e2e-quarantine/report
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from the root package.json packageManager
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # The one pnpm workspace is rooted at the repository root.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # As in client-e2e: survives an apt-mirror outage as long as every engine still launches.
      - name: Install browsers
        timeout-minutes: 15
        run: bash ../eng/playwright-browsers/install-browsers.sh chromium firefox webkit -- node_modules/.bin/playwright
      - run: pnpm run tokens:build-css
      - run: pnpm run build:showcase
      # All projects, so a quarantined @cross-engine test still runs on every engine.
      - name: Quarantined e2e (ten runs each)
        run: >
          node scripts/e2e.mjs --grep "@quarantine" --repeat-each 10 --pass-with-no-tests
          --reporter list,json,html
          --output .artifacts/e2e-quarantine/results
      - name: Summarise the quarantined tests
        if: always()
        run: node scripts/e2e-quarantine-summary.mjs .artifacts/e2e-quarantine/report.json
      - name: Upload the quarantined-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-quarantine-e2e-report
          path: client/.artifacts/e2e-quarantine
          if-no-files-found: ignore
