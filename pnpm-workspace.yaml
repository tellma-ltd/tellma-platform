# The one pnpm workspace of the repository. A single install at the repository root links every
# package below against one lockfile (pnpm-lock.yaml, beside this file), so the platform's Angular
# workspace and every distribution's Client project resolve one copy of Angular between them.
packages:
  # The platform's Angular workspace: every published @tellma/* library, built with ng-packagr.
  - client
  # The Node packages inside it, which install and build on their own.
  - client/projects/core/tellma-core-ui-mcp
  - client/projects/core/tellma-core-tools
  # Each distribution's Angular application (an esproj), once it exists.
  - distributions/*/src/*.Client

# Every external version the workspace packages use, in one place. A package names a dependency
# with the specifier `catalog:` and takes its version from here, so no two packages can drift onto
# different versions of a shared dependency.
catalog:
  '@angular/aria': 22.0.3
  '@angular/build': 22.0.5
  '@angular/cdk': 22.0.3
  '@angular/cli': 22.0.5
  '@angular/common': 22.0.5
  '@angular/compiler': 22.0.5
  '@angular/compiler-cli': 22.0.5
  '@angular/core': 22.0.5
  '@angular/forms': 22.0.5
  '@angular/platform-browser': 22.0.5
  '@angular/router': 22.0.5
  '@capsizecss/metrics': ^4.1.0
  '@eslint/js': ^10.0.1
  '@fontsource-variable/noto-sans': 5.2.10
  '@fontsource-variable/noto-sans-arabic': 5.2.10
  '@fontsource/noto-sans-mono': 5.2.10
  '@internationalized/date': 3.12.2
  '@jsverse/transloco': 8.4.0
  '@microsoft/api-extractor': 7.58.9
  '@modelcontextprotocol/sdk': 1.29.0
  '@playwright/test': 1.61.1
  '@types/node': ^24.13.2
  '@typescript-eslint/utils': 8.62.1
  '@vitest/browser-playwright': 4.1.9
  angular-eslint: 22.0.0
  axe-core: 4.12.1
  esbuild: 0.28.1
  eslint: 10.6.0
  jsdom: 29.1.1
  lucide: 1.66.0
  ng-packagr: 22.0.1
  postcss-value-parser: 4.2.0
  prettier: ^3.8.1
  rxjs: ~7.8.0
  stylelint: 17.14.0
  ts-morph: 28.0.0
  tslib: ^2.3.0
  tsx: 4.22.4
  typescript: ~6.0.2
  typescript-eslint: 8.62.1
  vitest: 4.1.9
  zod: 4.4.3

# Adding a dependency to any workspace package must go through the catalog above.
catalogMode: strict

# Dependencies whose install scripts may run (pnpm runs none it is not told to).
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
